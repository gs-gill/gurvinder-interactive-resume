oups h3{font-size:13px}.skill-tag{font:700 11px var(--mono);padding:7px 9px;border-radius:8px;background:#eaf0df;color:#31543d}.strengths{display:grid;gap:12px}.strength{display:flex;gap:15px;align-items:flex-start}.strength b{min-width:160px;color:#365942}.strength p{margin:0;color:#59685e;font-size:13px;line-height:1.55}.contact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.contact-card{display:block;text-decoration:none;padding:16px;border:1px solid #20332920;background:#fffdf5;border-radius:14px}.contact-card small{display:block;font:800 9px var(--mono);color:#6f8c5b;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}.contact-card strong{font-size:14px;overflow-wrap:anywhere}.menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.menu-item{display:flex;justify-content:space-between;align-items:center;text-align:left;border:1px solid #20332922;background:#fffdf6;border-radius:14px;padding:15px;cursor:pointer;font-weight:850}.menu-item:hover{background:#e7efd9}.menu-item span:last-child{color:#77906c}.map-box{height:min(55vh,420px);min-height:250px;position:relative;border-radius:17px;overflow:hidden;background:#cae0bb;border:1px solid #2033291c}.map-box canvas{width:100%;height:100%;display:block}.map-note{font-size:11px;color:#657267;margin-top:10px}.toast{position:fixed;z-index:20;left:50%;top:84px;transform:translate(-50%,-8px);background:var(--ink);color:#fff;padding:10px 14px;border-radius:999px;font:700 11px var(--mono);opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.noscript{position:fixed;inset:auto 15px 15px;background:white;padding:10px;border-radius:8px;z-index:100}@media(max-width:760px){.topbar{padding-top:max(12px,env(safe-area-inset-top));}.brand{font-size:10px}.brand-mark{width:31px;height:31px}.top-actions{gap:5px}.icon-btn{padding:9px 10px;font-size:11px}.icon-btn .glyph{margin:0}.status{top:65px;padding:13px 14px;width:min(245px,62vw)}.status p{font-size:11px}.mission{top:auto;right:12px;bottom:105px;width:150px;padding:11px 12px}.mission strong{font-size:11px}.location-pin{bottom:94px;font-size:9px}.dock{bottom:max(12px,env(safe-area-inset-bottom));gap:4px;padding:7px;border-radius:15px}.drive-hint{font-size:9px;padding:0 4px}.key{min-width:20px;height:20px}.dock button{padding:9px 11px;font-size:10px}.touchpad{display:grid;bottom:max(12px,env(safe-area-inset-bottom));left:12px;grid-template:repeat(2,38px)/repeat(3,38px)}.touchpad button{font-size:15px}.panel-wrap{padding:10px}.panel{max-height:88vh;border-radius:19px}.grid2{grid-template-columns:1fr}.full{grid-column:auto}.skill-groups .card{grid-template-columns:1fr}.strength{display:block}.strength b{display:block;margin-bottom:5px}.contact-grid,.menu-grid{grid-template-columns:1fr 1fr}}@media(max-width:430px){.top-actions .icon-btn{width:38px;height:38px;padding:0}.icon-btn .glyph{margin:0}.icon-btn .label{position:absolute;clip:rect(0,0,0,0)}.brand{gap:7px;letter-spacing:.03em}.status{top:59px}.mission{bottom:149px}.location-pin{bottom:138px}.dock{left:auto;right:10px;transform:none;bottom:12px}.drive-hint{display:none}.touchpad{bottom:12px}.contact-grid{grid-template-columns:1fr}.menu-grid{grid-template-columns:1fr 1fr}.panel h2{font-size:34px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}

<body>
<canvas id="world" aria-label="A small illustrated driving world. Use arrow keys or WASD to explore career locations."></canvas><div class="grain" aria-hidden="true"></div>
<header class="topbar"><a class="brand" href="#" aria-label="Gurvinder Singh Gill home"><span class="brand-mark">GS</span><span>Gurvinder Singh Gill <span style="color:#718470">/ data engineer</span></span></a><div class="top-actions"><button class="icon-btn" id="mapButton" aria-label="Open map"><span class="glyph" aria-hidden="true">⌖</span><span class="label">Map</span></button><button class="icon-btn" id="soundButton" aria-label="Toggle sound"><span class="glyph" aria-hidden="true">♫</span><span class="label">Sound off</span></button><button class="icon-btn" id="menuButton" aria-label="Open menu"><span class="glyph" aria-hidden="true">☰</span><span class="label">Menu</span></button></div></header>

<script>
(()=>{'use strict';
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d',{alpha:false}),wrap=document.getElementById('panelWrap'),content=document.getElementById('panelContent'),keys=new Set(),visited=new Set(),W=2200,H=1600;
const zones=[
 {id:'intro',name:'Start / About',x:1100,y:290,color:'#f1a172',label:'START HERE',hint:'Meet Gurvinder',title:'Hey, I’m Gurvinder.',eyebrow:'Data Engineer · Bengaluru, India',text:'I build data-intensive applications and solve architectural and scalability challenges. My work has spanned healthcare, e-commerce, manufacturing and financial data.',tags:['4+ years in data','Tiger Analytics','Bengaluru, IN'],kind:'intro'},
 {id:'experience',name:'Career / Experience',x:1740,y:695,color:'#82a5e7',label:'CAREER',hint:'Career missions',title:'Work that moves data forward.',eyebrow:'Career · Bengaluru, India',kind:'experience'},
 {id:'skills',name:'Skills / Toolkit',x:1120,y:1280,color:'#84b97a',label:'TOOLKIT',hint:'The tools I use',title:'A practical data toolkit.',eyebrow:'Skills · From the résumé',kind:'skills'},
 {id:'education',name:'Education / Strengths',x:460,y:890,color:'#e3bd5c',label:'EDUCATION',hint:'How I learn and work',title:'Good systems need good teams.',eyebrow:'Education & strengths',kind:'education'},
 {id:'contact',name:'Contact / Connect',x:650,y:420,color:'#c283bd',label:'CONNECT',hint:'Get in touch',title:'Let’s build something useful.',eyebrow:'Contact · Open to a conversation',kind:'contact'}
];
const player={x:1100,y:405,a:-Math.PI/2,v:0};let activeZone=null,started=false,sound=false,frame=0,cam={x:0,y:0},dpr=1,last=0,lastDraw=0,toastTimer=0,audioCtx=null,engineOsc=null,engineGain=null;
function fit(){dpr=Math.min(devicePixelRatio||1,1.7);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px'}addEventListener('resize',fit);fit();
function roundedRect(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function drawTree(x,y,s=1){ctx.fillStyle='#779d63';ctx.beginPath();ctx.ellipse(x+4*s,y+9*s,23*s,11*s,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#896b4f';ctx.fillRect(x-4*s,y-1*s,8*s,20*s);ctx.fillStyle='#608754';ctx.beginPath();ctx.arc(x,y-7*s,20*s,0,Math.PI*2);ctx.fill();ctx.fillStyle='#84aa70';ctx.beginPath();ctx.arc(x-8*s,y-15*s,11*s,0,Math.PI*2);ctx.fill();ctx.fillStyle='#a0bb7c';ctx.beginPath();ctx.arc(x+7*s,y-13*s,7*s,0,Math.PI*2);ctx.fill()}
function drawWorld(){ctx.setTransform(dpr,0,0,dpr,0,0);const vw=innerWidth,vh=innerHeight;ctx.fillStyle='#d7e7c2';ctx.fillRect(0,0,vw,vh);const scale=Math.min(vw/1120,vh/760,1.18);cam.x=player.x-vw/(2*scale);cam.y=player.y-vh/(2*scale);cam.x=Math.max(0,Math.min(W-vw/scale,cam.x));cam.y=Math.max(0,Math.min(H-vh/scale,cam.y));ctx.setTransform(dpr*scale,0,0,dpr*scale,-cam.x*dpr*scale,-cam.y*dpr*scale);
ctx.fillStyle='#d7e7c2';ctx.fillRect(0,0,W,H);
// Park patches and winding paths
for(let i=0;i<16;i++){const x=90+(i*347)%1980,y=80+(i*223)%1430;ctx.fillStyle=i%2?'#cde1b8':'#dce9c9';ctx.beginPath();ctx.ellipse(x,y,110+(i%3)*24,68+(i%4)*13,(i%5)*.2,0,Math.PI*2);ctx.fill()}
// Pond
ctx.fillStyle='#91b9b0';ctx.beginPath();ctx.ellipse(480,1200,180,92,-.18,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f7f4ea88';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(480,1200,145,65,-.18,0,Math.PI*2);ctx.stroke();
// Road loop with center stripe
ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.ellipse(1100,800,700,500,0,0,Math.PI*2);ctx.strokeStyle='#84907f';ctx.lineWidth=178;ctx.stroke();ctx.beginPath();ctx.ellipse(1100,800,700,500,0,0,Math.PI*2);ctx.strokeStyle='#e6e4d8';ctx.lineWidth=165;ctx.stroke();ctx.beginPath();ctx.ellipse(1100,800,700,500,0,0,Math.PI*2);ctx.strokeStyle='#c8c7b8';ctx.lineWidth=2;ctx.setLineDash([18,20]);ctx.stroke();ctx.setLineDash([]);
// Plaza and tiny buildings
const buildings=[[360,430,150,98,'CAFÉ'],[1770,280,165,110,'STUDIO'],[1800,1130,155,110,'WORKSHOP'],[400,1130,155,100,'LIBRARY']];for(const [x,y,w,h,label] of buildings){ctx.fillStyle='#82916e';roundedRect(ctx,x+7,y+10,w,h,15);ctx.fill();ctx.fillStyle='#f7f1dd';roundedRect(ctx,x,y,w,h,14);ctx.fill();ctx.fillStyle='#d58b68';roundedRect(ctx,x-5,y-8,w+10,27,10);ctx.fill();ctx.fillStyle='#37503a';ctx.font='800 12px ui-monospace,monospace';ctx.textAlign='center';ctx.fillText(label,x+w/2,y+54);ctx.fillStyle='#bdd2a7';roundedRect(ctx,x+w/2-18,y+65,36,33,5);ctx.fill()}
// Trees in planted groups
for(let i=0;i<37;i++){let x=100+(i*271)%2000,y=70+(i*431)%1450;if(Math.hypot((x-1100)/700,(y-800)/500)>.99)drawTree(x,y,.68+(i%4)*.12)}
// Career stops
zones.forEach((z,i)=>{const nearby=activeZone?.id===z.id;ctx.fillStyle=z.color+'33';ctx.beginPath();ctx.arc(z.x,z.y,nearby?69:55,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fffdf4';ctx.beginPath();ctx.arc(z.x,z.y,34,0,Math.PI*2);ctx.fill();ctx.strokeStyle=z.color;ctx.lineWidth=4;ctx.stroke();ctx.fillStyle=z.color;ctx.beginPath();ctx.arc(z.x,z.y,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1d3024';ctx.font='900 12px ui-monospace,monospace';ctx.textAlign='center';ctx.fillText(z.label,z.x,z.y-47);ctx.font='700 10px ui-monospace,monospace';ctx.fillStyle='#566552';ctx.fillText(visited.has(z.id)?'✓ EXPLORED':'STOP 0'+(i+1),z.x,z.y+65)});
// The little car
ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.a);ctx.fillStyle='#263b2b35';roundedRect(ctx,-25,-15,56,34,10);ctx.fill();ctx.fillStyle='#293d31';roundedRect(ctx,-24,-16,50,32,9);ctx.fill();ctx.fillStyle='#f38d62';roundedRect(ctx,-16,-14,34,28,7);ctx.fill();ctx.fillStyle='#d6e9c8';roundedRect(ctx,-9,-11,17,22,4);ctx.fill();ctx.fillStyle='#ffe5a1';ctx.fillRect(15,-10,4,6);ctx.fillRect(15,4,4,6);ctx.fillStyle='#28382c';ctx.fillRect(-16,-19,10,4);ctx.fillRect(7,-19,10,4);ctx.fillRect(-16,15,10,4);ctx.fillRect(7,15,10,4);ctx.restore();
}
function nearest(){let best=null,dist=1e9;for(const z of zones){const d=Math.hypot(player.x-z.x,player.y-z.y);if(d<dist){best=z;dist=d}}return dist<150?best:null}
function updateStatus(){const n=nearest();if(n?.id!==activeZone?.id){activeZone=n;if(n){document.getElementById('statusEyebrow').textContent=n.name;document.getElementById('statusTitle').textContent=n.hint;document.getElementById('statusText').textContent='Press E or use Explore nearby to open this stop.';document.getElementById('locationText').textContent=n.label;document.getElementById('liveText').textContent='You are near '+n.name+'. Press E to explore.'}else{document.getElementById('statusEyebrow').textContent='Your next stop';document.getElementById('statusTitle').textContent='Keep exploring';document.getElementById('statusText').textContent='Follow the path and drive toward a marked career stop.';document.getElementById('locationText').textContent='PORTFOLIO PARK'}}document.getElementById('missionDots').textContent=zones.map(z=>visited.has(z.id)?'●':'○').join(' ')}
function loop(t){const dt=Math.min((t-last)/1000||.016,.04);last=t;if(!wrap.classList.contains('open')){const up=keys.has('ArrowUp')||keys.has('w'),down=keys.has('ArrowDown')||keys.has('s'),left=keys.has('ArrowLeft')||keys.has('a'),right=keys.has('ArrowRight')||keys.has('d');if(up)player.v=Math.min(290,player.v+270*dt);else if(down)player.v=Math.max(-120,player.v-300*dt);else player.v*=Math.pow(.12,dt);if(Math.abs(player.v)>3){if(left)player.a-=2.3*dt*Math.sign(player.v);if(right)player.a+=2.3*dt*Math.sign(player.v);player.x+=Math.cos(player.a)*player.v*dt;player.y+=Math.sin(player.a)*player.v*dt;player.x=Math.max(40,Math.min(W-40,player.x));player.y=Math.max(40,Math.min(H-40,player.y));started=true}updateStatus()}if(audioCtx&&engineOsc&&engineGain){engineOsc.frequency.setTargetAtTime(58+Math.abs(player.v)*.65,audioCtx.currentTime,.08);engineGain.gain.setTargetAtTime(sound?(Math.abs(player.v)>3?.012:.002):0,audioCtx.currentTime,.1)}if(t-lastDraw>33){drawWorld();lastDraw=t}frame=requestAnimationFrame(loop)}frame=requestAnimationFrame(loop);
const intro=()=>`<p class="eyebrow">${zones[0].eyebrow}</p><h2 id="panelTitle">${zones[0].title}</h2><p class="panel-intro">${zones[0].text}</p><div class="intro-tags">${zones[0].tags.map(x=>`<span class="chip">${x}</span>`).join('')}</div><div class="actions" style="margin-top:22px;display:flex;gap:10px;flex-wrap:wrap"><button class="menu-item" data-open="experience">Explore my career <span>↗</span></button><a class="menu-item" href="resume_2023.pdf" download>Download résumé <span>↓</span></a></div>`;
const experience=()=>`<p class="eyebrow">${zones[1].eyebrow}</p><h2 id="panelTitle">${zones[1].title}</h2><p class="panel-intro">Data engineering across analytics consulting, healthcare, e-commerce, construction and financial data.</p><div class="grid2"><article class="card full"><div class="meta">2021 — Present · Bengaluru, IN</div><h3>Data Engineer · Tiger Analytics</h3><p>Advanced Analytics and AI consulting, providing data-driven analytics and decision-making.</p><ul><li>Spearheaded critical workflow migration from Scala to PySpark, reducing code complexity by approximately 40%.</li><li>Helped the LEGO team parallelize model training and deployment with SparkR and Databricks: about 60% better performance and 45% lower compute cost.</li><li>Built ReactiveCore applications to load, categorize, vectorize and match healthcare individual and organization data from several providers using PySpark, SQL Server, AWS S3, HDFS and Airflow.</li></ul></article><article class="card full"><div class="meta">2018 — 2021 · Bengaluru, IN</div><h3>Software Engineer · Fragma Data Systems</h3><p>Big Data Analytics solutions provider helping organizations transform data into insights.</p><ul><li>Developed a near real-time L&amp;T construction-machine tracker with Azure IoT Hub, PySpark, Python and SQL Server. Failure alerts helped raise productivity by about 65%.</li><li>Built a Mashreq data-ingestion framework for transactions across diverse primary data sources using PySpark, Python, Hive and Airflow.</li></ul></article></div>`;
const skills=()=>`<p class="eyebrow">${zones[2].eyebrow}</p><h2 id="panelTitle">${zones[2].title}</h2><p class="panel-intro">Tools and technologies listed in the résumé, grouped for a quick scan.</p><div class="skill-groups">${[['Programming','Python','SQL','Scala'],['Data','ETL Pipelines','Data Analysis','Hive','Spark','MSSQL','Data Modelling','Data Migration','Glue','Redshift','Athena','IoT Hub','Lambda'],['Cloud','AWS','Azure'],['Tools','Bitbucket','GitLab','Jira','Airflow']].map(([group,...items])=>`<article class="card"><h3>${group}</h3><div class="tags">${items.map(x=>`<span class="skill-tag">${x}</span>`).join('')}</div></article>`).join('')}</div>`;
const education=()=>`<p class="eyebrow">${zones[3].eyebrow}</p><h2 id="panelTitle">${zones[3].title}</h2><div class="grid2"><article class="card"><div class="meta">July 2013 — August 2017</div><h3>B.E. Computer Science</h3><p>Technocrats Institute of Technology<br>Bhopal, India</p></article><article class="card"><div class="meta">How I work</div><div class="strengths"><div class="strength"><b>Communication</b><p>I can break complex subjects down for junior colleagues; teammates describe me as patient, understanding and willing to help.</p></div><div class="strength"><b>Creativity</b><p>I put creative effort into finding a solution.</p></div><div class="strength"><b>Results focused</b><p>I make sure the team is moving in the right direction.</p></div></div></article></div>`;
const contact=()=>`<p class="eyebrow">${zones[4].eyebrow}</p><h2 id="panelTitle">${zones[4].title}</h2><p class="panel-intro">For data engineering opportunities, collaboration, or a conversation about dependable data systems.</p><div class="contact-grid"><a class="contact-card" href="mailto:imgurvinder7@gmail.com"><small>Email</small><strong>imgurvinder7@gmail.com</strong></a><a class="contact-card" href="tel:+918251005831"><small>Phone</small><strong>+91 82510 05831</strong></a><div class="contact-card"><small>Location</small><strong>Bengaluru, India</strong></div><a class="contact-card" href="resume_2023.pdf" download><small>Résumé PDF</small><strong>Download résumé ↓</strong></a></div>`;
const render={intro,experience,skills,education,contact};
function openPanel(kind){if(!render[kind])return;const zone=zones.find(z=>z.kind===kind);if(zone)visited.add(zone.id);content.innerHTML=render[kind]();wrap.classList.add('open');document.getElementById('closePanel').focus();content.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openPanel(b.dataset.open)));}
function closePanel(){wrap.classList.remove('open');document.getElementById('interactButton').focus()}
function showToast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
function interact(){if(activeZone){openPanel(activeZone.kind)}else if(!started){openPanel('intro')}else{const z=zones.reduce((a,b)=>Math.hypot(player.x-a.x,player.y-a.y)<Math.hypot(player.x-b.x,player.y-b.y)?a:b);showToast('Nearest stop: '+z.hint+' · drive closer to open it')}}
document.getElementById('interactButton').addEventListener('click',interact);document.getElementById('closePanel').addEventListener('click',closePanel);wrap.addEventListener('click',e=>{if(e.target===wrap)closePanel()});document.getElementById('menuButton').addEventListener('click',()=>openPanel('menu'));document.getElementById('mapButton').addEventListener('click',()=>openPanel('map'));document.querySelector('.brand').addEventListener('click',e=>{e.preventDefault();player.x=1100;player.y=405;player.a=-Math.PI/2;player.v=0;openPanel('intro')});document.getElementById('soundButton').addEventListener('click',()=>{try{if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();engineOsc=audioCtx.createOscillator();engineGain=audioCtx.createGain();engineOsc.type='triangle';engineOsc.frequency.value=58;engineGain.gain.value=0;engineOsc.connect(engineGain);engineGain.connect(audioCtx.destination);engineOsc.start()}if(audioCtx.state==='suspended')audioCtx.resume();sound=!sound;document.querySelector('#soundButton .label').textContent=sound?'Sound on':'Sound off';document.getElementById('soundButton').setAttribute('aria-label',sound?'Turn sound off':'Turn sound on');showToast(sound?'Engine sound on':'Sound muted')}catch{showToast('Audio is unavailable in this browser')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&wrap.classList.contains('open')){closePanel();return}if((e.key==='e'||e.key==='E')&&!wrap.classList.contains('open')){interact();return}if(e.key==='m'||e.key==='M'){openPanel('map');return}if(wrap.classList.contains('open'))return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)){e.preventDefault();keys.add(e.key)}else if(['w','a','s','d','W','A','S','D'].includes(e.key)){keys.add(e.key.toLowerCase())}});document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()==='arrowup'?'ArrowUp':e.key.toLowerCase()==='arrowdown'?'ArrowDown':e.key.toLowerCase()==='arrowleft'?'ArrowLeft':e.key.toLowerCase()==='arrowright'?'ArrowRight':e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());
document.querySelectorAll('.touchpad button').forEach(b=>{const k={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'}[b.dataset.key];const start=e=>{e.preventDefault();keys.add(k);b.setPointerCapture?.(e.pointerId)};const end=()=>keys.delete(k);b.addEventListener('pointerdown',start);b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);b.addEventListener('lostpointercapture',end)});
function mapPanel(){return`<p class="eyebrow">Portfolio Park · map</p><h2 id="panelTitle">Choose a stop.</h2><p class="panel-intro">Pick a marker to drive there and open its section.</p><div class="map-box"><canvas id="mapCanvas" aria-label="Map with five résumé stops"></canvas></div><div class="menu-grid" style="margin-top:12px">${zones.map(z=>`<button class="menu-item" data-zone="${z.id}">${z.hint}<span>↗</span></button>`).join('')}</div><p class="map-note">Move with W A S D or arrow keys. Press E near a marker to explore.</p>`}
function menuPanel(){return`<p class="eyebrow">Gurvinder Singh Gill · Data Engineer</p><h2 id="panelTitle">Pick a destination.</h2><p class="panel-intro">Jump to a résumé stop, or take the scenic route and drive there.</p><div class="menu-grid">${zones.map(z=>`<button class="menu-item" data-zone="${z.id}">${z.name}<span>↗</span></button>`).join('')}</div><div class="actions" style="margin-top:16px"><a class="menu-item" href="resume_2023.pdf" download>Download résumé PDF <span>↓</span></a></div>`}
const originalOpen=openPanel;openPanel=function(kind){if(kind==='map'||kind==='menu'){content.innerHTML=kind==='map'?mapPanel():menuPanel();wrap.classList.add('open');content.querySelectorAll('[data-zone]').forEach(b=>b.addEventListener('click',()=>{const z=zones.find(x=>x.id===b.dataset.zone);player.x=z.x;player.y=z.y-100;player.v=0;activeZone=z;closePanel();setTimeout(()=>openPanel(z.kind),80)}));if(kind==='map')drawMap();document.getElementById('closePanel').focus();return}originalOpen(kind)};
function drawMap(){const c=document.getElementById('mapCanvas');if(!c)return;const r=c.getBoundingClientRect(),ratio=Math.min(devicePixelRatio||1,1.5);c.width=r.width*ratio;c.height=r.height*ratio;const g=c.getContext('2d');g.scale(ratio,ratio);const sx=r.width/W,sy=r.height/H;g.fillStyle='#d7e7c2';g.fillRect(0,0,r.width,r.height);g.fillStyle='#e8e3cf';g.beginPath();g.ellipse(1100*sx,800*sy,700*sx,500*sy,0,0,Math.PI*2);g.lineWidth=70*Math.min(sx,sy);g.strokeStyle='#899180';g.stroke();g.lineWidth=63*Math.min(sx,sy);g.strokeStyle='#f1eee1';g.stroke();zones.forEach(z=>{g.beginPath();g.arc(z.x*sx,z.y*sy,10,0,Math.PI*2);g.fillStyle=z.color;g.fill();g.fillStyle='#25372b';g.font='bold 10px system-ui';g.fillText(z.label,z.x*sx+13,z.y*sy+4)});g.beginPath();g.arc(player.x*sx,player.y*sy,6,0,Math.PI*2);g.fillStyle='#ef7752';g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke()}

// Opening the intro on first click gives keyboard and touch users an explicit start point.
document.getElementById('interactButton').textContent='Start exploring ↗';document.getElementById('interactButton').addEventListener('click',()=>{if(!started&&!activeZone)openPanel('intro')},{once:false});
})();
